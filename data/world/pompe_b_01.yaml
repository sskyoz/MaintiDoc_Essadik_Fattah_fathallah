  - {document_id: manuel_pompe_b, type: manuel, titre: "Manuel d'utilisation pompe multicellulaire MX-400", version: "v1.3 (2025-04)", nb_pages: 28, langue: fr, format: pdf_texte, elements_visuels: "fig 8.1 p.8 (vue éclatée) ; fig 22.1 p.22 (panneau de commande) ; tableau codes p.24", groupes: [techniciens_pompes, responsables], usage_test: normal}
  - {document_id: codes_alarme_pompe_b, type: codes_alarme, titre: "Codes d'alarme pompe MX-400", version: "v1.0 (2025-04)", nb_pages: 4, langue: fr, format: pdf_texte, elements_visuels: "tableau codes p.2", groupes: [techniciens_pompes, responsables], usage_test: ambigu}
  - {document_id: fiche_securite_pompe_b, type: fiche_securite, titre: "Fiche de sécurité pompe MX-400", version: "v1.0 (2025-04)", nb_pages: 3, langue: fr, format: pdf_texte, elements_visuels: "tableau risques p.2", groupes: [techniciens_pompes, responsables], usage_test: normal}
  - {document_id: schema_pompe_b, type: schema, titre: "Schémas hydraulique et capteurs pompe MX-400", version: "v1.0 (2025-04)", nb_pages: 2, langue: fr, format: pdf_texte, elements_visuels: "fig 1 p.1 (circuit hydraulique) ; fig 2 p.2 (implantation des capteurs)", groupes: [techniciens_pompes, responsables], usage_test: normal}
  - {document_id: photo_panneau_pompe_b, type: photo, titre: "Panneau de commande pompe MX-400", version: "2026-11", nb_pages: 1, langue: fr, format: image, elements_visuels: "voyants vert, orange, rouge, bleu ; afficheur", groupes: [techniciens_pompes, responsables], usage_test: normal}
  - {document_id: historique_pompe_b, type: historique, titre: "Historique des interventions POMPE-B-01", version: "v1.0 (2026-10)", nb_pages: 4, langue: fr, format: pdf_texte, elements_visuels: "tableau interventions p.2", groupes: [techniciens_pompes, responsables], usage_test: normal}
  - {document_id: proc_demarrage_pompe_b, type: procedure, titre: "Procédure de démarrage et d'arrêt pompe MX-400", version: "v1.0 (2025-04)", nb_pages: 5, langue: fr, format: pdf_texte, elements_visuels: "schéma vannes p.2", groupes: [techniciens_pompes, responsables], usage_test: normal}
  - {document_id: proc_garniture_pompe_b, type: procedure, titre: "Procédure de remplacement de la garniture mécanique pompe MX-400", version: "v1.0 (2025-04)", nb_pages: 6, langue: fr, format: pdf_texte, elements_visuels: "schéma garniture p.3", groupes: [techniciens_pompes, responsables], usage_test: normal}

