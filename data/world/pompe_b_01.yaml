  - {ticket: TCK-2025-0305, date: "2025-11-06", type: alarme, code: E58, resume: "Pression d'aspiration basse, filtre d'aspiration colmaté, nettoyé", statut: clos}
  - {ticket: TCK-2026-0101, date: "2026-05-18", type: alarme, code: E41, resume: "Température de palier à 92 °C, regraissage des roulements", statut: clos}
