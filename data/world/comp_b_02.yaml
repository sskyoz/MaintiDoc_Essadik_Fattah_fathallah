  - {ticket: TCK-2025-0289, date: "2025-10-15", type: alarme, code: E71, resume: "Purge automatique bloquée, électrovanne de purge nettoyée", statut: clos}
  - {ticket: TCK-2026-0156, date: "2026-08-04", type: alarme, code: M01, resume: "Compteur de 2000 h atteint, maintenance préventive à planifier", statut: ouvert}
